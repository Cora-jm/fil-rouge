---
- name: Créer le dossier de travail de Jenkins
  ansible.builtin.file:
    path: "{{ jenkins_dir }}/jenkins"
    state: directory
    mode: "0755"

- name: Copier le Dockerfile de Jenkins
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ jenkins_dir }}/jenkins/Dockerfile"
    mode: "0644"

- name: Générer le fichier compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jenkins_dir }}/docker-compose.yml"
    mode: "0644"

- name: Lancer Jenkins
  community.docker.docker_compose_v2:
    project_src: "{{ jenkins_dir }}"
    project_name: "{{ jenkins_project }}"
    build: always
    state: present
