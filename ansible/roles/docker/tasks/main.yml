---
- name: Chercher la commande docker
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Installer Docker si absent
  ansible.builtin.apt:
    name: "{{ docker_package }}"
    state: present
    update_cache: true
  become: true
  when: docker_check.rc != 0
